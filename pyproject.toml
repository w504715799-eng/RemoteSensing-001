[project]
name = "trustsr"
version = "0.1.0"
description = "Risk-controlled Sentinel-2 super-resolution experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlstac==0.4.9",
  "numpy>=2.0,<3",
  "opensr-test==1.3.3",
  "pandas>=2.2,<3",
  "safetensors>=0.4,<1",
  "scipy>=1.14,<2",
  "sen2sr==0.8.5",
  "torch>=2.4,<3",
]

[project.optional-dependencies]
gpu = [
  "opensr-model==1.1.1",
]

[project.scripts]
trustsr-smoke = "trustsr.cli.smoke_baseline:main"
trustsr-benchmark = "trustsr.cli.benchmark_baselines:main"
trustsr-ldsr-gpu = "trustsr.cli.ldsr_gpu:main"
trustsr-conformal-smoke = "trustsr.cli.conformal_smoke:main"
trustsr-dataset-audit = "trustsr.cli.dataset_audit:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustsr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
